  <body>
    <div id="root"></div>
    <!-- Apply viewport zoom before React renders to avoid layout flash -->
    <script>
      (function() {
        var BASE = 1440, WIDE_BP = 1920, TARGET = 0.8, WIDE_SCALE = 1, MOBILE_MAX = 1023;
        var w = window.innerWidth;
        // Phones render the separate mobile build (src/mobile/MobileApp.tsx), which
        // is authored at real device width — zooming it here would shrink it to ~20%.
        if (w <= MOBILE_MAX) return;
        var scale = w >= WIDE_BP ? WIDE_SCALE : Math.min(TARGET, (w / BASE) * TARGET);
        document.documentElement.style.zoom = scale.toFixed(4);
      })();
    </script>
